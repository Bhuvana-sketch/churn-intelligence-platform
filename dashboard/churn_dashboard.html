<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Customer Churn Intelligence Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<style>
:root{
  --bg:#0b1220; --panel:#101a2e; --panel2:#141f38; --border:#223055; --border-soft:#1a2543;
  --text:#eaf0ff; --text-dim:#93a2c8; --text-faint:#5f6f96;
  --accent:#31c9c3; --accent-soft:#173634; --risk:#ff6b5e; --risk-soft:#3a1a1e;
  --amber:#f4b740; --violet:#8b7cf6; --green:#4ade80;
  --grid:#1c2846;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
*{box-sizing:border-box;}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:'IBM Plex Sans',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
}
.mono{font-family:'IBM Plex Mono',monospace;}

/* ---------- Top bar ---------- */
.topbar{
  position:sticky; top:0; z-index:20;
  padding-top:env(safe-area-inset-top,0px);
  background:linear-gradient(180deg,#0d1526 0%, #0b1220 100%);
  border-bottom:1px solid var(--border);
}
.topbar-inner{
  max-width:1280px; margin:0 auto; padding:18px 24px 0 24px;
  display:flex; align-items:baseline; justify-content:space-between; flex-wrap:wrap; gap:10px;
}
.brand{display:flex; align-items:baseline; gap:12px;}
.brand-mark{
  width:10px; height:10px; border-radius:2px; background:var(--accent);
  box-shadow:0 0 12px var(--accent); display:inline-block; margin-right:2px; transform:translateY(-1px);
}
.brand h1{font-size:17px; font-weight:600; margin:0; letter-spacing:0.01em;}
.brand span.tag{color:var(--text-faint); font-size:12px; margin-left:10px;}
.dataset-note{font-size:11.5px; color:var(--text-faint);}

.tabs{
  max-width:1280px; margin:14px auto 0 auto; padding:0 24px;
  display:flex; gap:2px; overflow-x:auto;
}
.tab{
  font-family:'IBM Plex Mono',monospace; font-size:12.5px; color:var(--text-dim);
  padding:10px 16px; cursor:pointer; white-space:nowrap; border-bottom:2px solid transparent;
  transition:color .15s ease, border-color .15s ease; user-select:none;
}
.tab .n{color:var(--text-faint); margin-right:8px;}
.tab:hover{color:var(--text);}
.tab.active{color:var(--text); border-bottom-color:var(--accent);}
.tab.active .n{color:var(--accent);}

/* ---------- Layout ---------- */
main{max-width:1280px; margin:0 auto; padding:28px 24px 64px 24px;}
.page{display:none;}
.page.active{display:block; animation:fade .25s ease;}
@keyframes fade{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);}}

.page-head{margin-bottom:22px;}
.page-head h2{font-size:22px; margin:0 0 6px 0; font-weight:600;}
.page-head p{margin:0; color:var(--text-dim); font-size:13.5px; max-width:640px; line-height:1.5;}

/* ---------- KPI row ---------- */
.kpi-row{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:22px;}
.kpi{
  background:var(--panel); border:1px solid var(--border-soft); border-radius:6px;
  padding:16px 18px;
}
.kpi .label{font-size:11px; color:var(--text-faint); text-transform:uppercase; letter-spacing:.06em;}
.kpi .value{font-family:'IBM Plex Mono',monospace; font-size:26px; font-weight:600; margin-top:6px;}
.kpi .sub{font-size:12px; color:var(--text-dim); margin-top:4px;}
.kpi.risk .value{color:var(--risk);}
.kpi.good .value{color:var(--accent);}

/* ---------- Grid / panels ---------- */
.grid{display:grid; gap:14px;}
.g2{grid-template-columns:1.3fr 1fr;}
.g2b{grid-template-columns:1fr 1.3fr;}
.g3{grid-template-columns:repeat(3,1fr);}
.panel{
  background:var(--panel); border:1px solid var(--border-soft); border-radius:6px; padding:18px 18px 12px 18px;
}
.panel h3{font-size:13px; font-weight:600; margin:0 0 2px 0;}
.panel .panel-sub{font-size:11.5px; color:var(--text-faint); margin-bottom:14px;}
.chart-wrap{position:relative; height:260px;}
.chart-wrap.tall{height:320px;}

/* ---------- Cohort cards ---------- */
.cohort-grid{display:grid; grid-template-columns:repeat(5,1fr); gap:12px; margin-bottom:18px;}
.cohort-card{
  background:var(--panel); border:1px solid var(--border-soft); border-radius:6px; padding:14px 14px 16px 14px;
  border-top:3px solid var(--c);
  cursor:default;
}
.cohort-card h4{font-size:12.5px; font-weight:600; margin:0 0 10px 0; line-height:1.3; min-height:32px;}
.cohort-card .big{font-family:'IBM Plex Mono',monospace; font-size:22px; font-weight:600; color:var(--c);}
.cohort-card .big-label{font-size:10.5px; color:var(--text-faint); text-transform:uppercase; letter-spacing:.05em; margin-bottom:2px;}
.cohort-card .rows{margin-top:10px; font-size:11.5px; color:var(--text-dim); display:flex; flex-direction:column; gap:4px;}
.cohort-card .rows div{display:flex; justify-content:space-between;}
.cohort-card .rows b{color:var(--text); font-weight:500; font-family:'IBM Plex Mono',monospace;}

/* ---------- Tables ---------- */
table{width:100%; border-collapse:collapse; font-size:12.5px;}
thead th{
  text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:.05em;
  color:var(--text-faint); font-weight:500; padding:8px 10px; border-bottom:1px solid var(--border);
  position:sticky; top:0; background:var(--panel);
}
tbody td{padding:8px 10px; border-bottom:1px solid var(--border-soft); color:var(--text-dim); font-family:'IBM Plex Mono',monospace; font-size:12px;}
tbody td:first-child{color:var(--text); font-family:'IBM Plex Sans',sans-serif;}
tbody tr:hover td{background:#0f1830;}
.table-scroll{max-height:420px; overflow:auto;}
.badge{
  display:inline-block; padding:2px 8px; border-radius:20px; font-size:10.5px; font-family:'IBM Plex Mono',monospace;
}
.badge.high{background:var(--risk-soft); color:var(--risk);}
.badge.med{background:#3a2f14; color:var(--amber);}
.badge.low{background:var(--accent-soft); color:var(--accent);}

/* ---------- Playbook ---------- */
.playbook-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:14px;}
.play-card{
  background:var(--panel); border:1px solid var(--border-soft); border-radius:6px; padding:16px 18px;
  display:flex; gap:14px;
}
.play-num{
  font-family:'IBM Plex Mono',monospace; font-size:20px; font-weight:600; color:var(--accent);
  min-width:30px;
}
.play-card h4{margin:0 0 6px 0; font-size:14px; font-weight:600;}
.play-card p{margin:0 0 8px 0; font-size:12.5px; color:var(--text-dim); line-height:1.55;}
.play-card .target{font-size:11px; font-family:'IBM Plex Mono',monospace; color:var(--text-faint);}
.play-card .target b{color:var(--amber); font-weight:500;}

footer{max-width:1280px; margin:0 auto; padding:10px 24px 40px 24px; color:var(--text-faint); font-size:11px;}

@media (max-width:920px){
  .kpi-row{grid-template-columns:repeat(2,1fr);}
  .g2, .g2b, .g3{grid-template-columns:1fr;}
  .cohort-grid{grid-template-columns:repeat(2,1fr);}
  .playbook-grid{grid-template-columns:1fr;}
}
@media (max-width:560px){
  .cohort-grid{grid-template-columns:1fr;}
}
</style>
</head>

<script>

Chart.defaults.font.family = "'IBM Plex Sans', sans-serif";
Chart.defaults.color = "#93a2c8";

const fmt = {

  int: (v) => Number(v).toLocaleString(),
};

/* ===================== Page definitions ===================== */

];

const PLAYBOOK = [

    title: "90-Day Contract Migration Offer",

    target: "At-Risk Newcomers, Wavering High-Spenders",
    metric: "Contract score is the #2 churn driver (16.7% importance)",
  },
  {
    title: "Fiber Security & Support Bundle",
    body: "Fiber customers without Online Security or Tech Support churn nearly 2.2x more than fully-protected fiber accounts. Offer a free 60-day trial of both add-ons at signup and at the 3-month mark for unprotected fiber households.",

    metric: "Fiber-without-security flag: 8.0% of model importance",
  },
  {
    title: "First-90-Days Onboarding Journey",

    target: "Disengaged Low-Spenders",
    metric: "ServicesAdopted correlates with engagement (r=+ moderate); engagement is inversely correlated with churn (r=-0.34)",
  },
];

/* ===================== Render shell ===================== */
function renderTabs(){
  const tabs = document.getElementById('tabs');
  tabs.innerHTML = PAGES.map((p,i)=>`<div class="tab" data-page="${p.id}"><span class="n">0${i+1}</span>${p.label}</div>`).join('');
  tabs.querySelectorAll('.tab').forEach(t=>{
    t.addEventListener('click', ()=> showPage(t.dataset.page));
  });
}

function showPage(id){
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active', t.dataset.page===id));
  document.querySelectorAll('.page').forEach(p=>p.classList.toggle('active', p.id==='page-'+id));
  if (id === 'overview' && !window.__charted_overview) { buildOverviewCharts(); window.__charted_overview = true; }
  if (id === 'cohorts' && !window.__charted_cohorts) { buildCohortCharts(); window.__charted_cohorts = true; }
  if (id === 'drivers' && !window.__charted_drivers) { buildDriverCharts(); window.__charted_drivers = true; }
  if (id === 'revenue' && !window.__charted_revenue) { buildRevenueCharts(); window.__charted_revenue = true; }
}

/* ===================== Page 1: Overview ===================== */
function pageOverview(){
  const k = DATA.kpis;
  return `
  <div class="page-head">
    <h2>Executive Overview</h2>
    <p>Base-wide health metrics across the full 7,043-customer book, refreshed from the scored customer table.</p>
  </div>
  <div class="kpi-row">
    <div class="kpi risk"><div class="label">Churn Rate</div><div class="value">${fmt.pct1(k.ChurnRate)}</div><div class="sub">${fmt.int(k.ChurnedCustomers)} of ${fmt.int(k.TotalCustomers)} customers</div></div>
    <div class="kpi risk"><div class="label">Monthly Revenue at Risk</div><div class="value">${fmt.money(k.MonthlyRevenueAtRisk)}</div><div class="sub">from churned accounts, last period</div></div>
    <div class="kpi"><div class="label">Avg. Tenure</div><div class="value">${k.AvgTenureMonths.toFixed(1)}<span style="font-size:14px;color:var(--text-faint)"> mo</span></div><div class="sub">across active + churned base</div></div>
    <div class="kpi good"><div class="label">Avg. Engagement Score</div><div class="value">${k.AvgEngagementScore.toFixed(1)}</div><div class="sub">of 100 &middot; risk score avg ${k.AvgRiskScore.toFixed(1)}</div></div>
  </div>
  <div class="grid g2">
    <div class="panel">
      <h3>Churn Rate by Tenure</h3>
      <div class="panel-sub">New accounts churn 8x more than long-tenured ones \u2014 tenure is the clearest retention lever</div>
      <div class="chart-wrap"><canvas id="chart-tenure-trend"></canvas></div>
    </div>
    <div class="panel">
      <h3>Churn Rate by Contract Type</h3>
      <div class="panel-sub">Month-to-month vs. one/two-year commitments</div>
      <div class="chart-wrap"><canvas id="chart-contract-overview"></canvas></div>
    </div>
  </div>`;
}

function buildOverviewCharts(){
  const tt = DATA.tenure_trend;
  new Chart(document.getElementById('chart-tenure-trend'), {
    type:'line',
    data:{ labels: tt.map(d=>d.TenureBucket+' mo'),
      datasets:[{ data: tt.map(d=>d.ChurnRate*100), borderColor:'#ff6b5e', backgroundColor:'rgba(255,107,94,0.12)',
        fill:true, tension:.35, pointRadius:3, pointBackgroundColor:'#ff6b5e' }]},
    options:{ plugins:{legend:{display:false}}, scales:{
      y:{ grid:{color:'#1c2846'}, ticks:{callback:v=>v+'%'} }, x:{ grid:{display:false} } } }
  });

  const bc = DATA.by_contract;
  new Chart(document.getElementById('chart-contract-overview'), {
    type:'bar',
    data:{ labels: bc.map(d=>d.Contract),
      datasets:[{ data: bc.map(d=>d.ChurnRate*100), backgroundColor:['#ff6b5e','#f4b740','#4ade80'], borderRadius:4, maxBarThickness:60 }]},
    options:{ plugins:{legend:{display:false}}, scales:{
      y:{ grid:{color:'#1c2846'}, ticks:{callback:v=>v+'%'} }, x:{ grid:{display:false} } } }
  });
}

/* ===================== Page 2: Cohorts ===================== */
function pageCohorts(){
  const cards = DATA.cohorts.map(c=>{
    const color = COHORT_COLOR[c.CohortName];
    return `
    <div class="cohort-card" style="--c:${color}">
      <h4>${c.CohortName}</h4>
      <div class="big-label">Churn Rate</div>
      <div class="big">${c.ChurnRatePct.toFixed(1)}%</div>
      <div class="rows">
        <div><span>Customers</span><b>${fmt.int(c.CustomerCount)} (${c.PctOfBase}%)</b></div>
        <div><span>Engagement</span><b>${c.AvgEngagementScore.toFixed(1)}</b></div>
        <div><span>Risk score</span><b>${c.AvgRiskScore.toFixed(1)}</b></div>
        <div><span>Tenure</span><b>${c.AvgTenureMonths.toFixed(1)} mo</b></div>
        <div><span>Monthly $</span><b>$${c.AvgMonthlyCharges.toFixed(0)}</b></div>
        <div><span>M2M %</span><b>${c.PctMonthToMonth.toFixed(0)}%</b></div>
      </div>

  }).join('');

  return `
  <div class="page-head">
    <h2>Cohort Explorer</h2>
    <p>Five behavioural cohorts identified via K-Means clustering on engineered engagement and risk-score features (tenure, spend, services adopted, contract commitment).</p>
  </div>
  <div class="cohort-grid">${cards}</div>
  <div class="grid g2b">
    <div class="panel">
      <h3>Churn Rate by Cohort</h3>
      <div class="panel-sub">Ranked highest to lowest risk</div>
      <div class="chart-wrap tall"><canvas id="chart-cohort-churn"></canvas></div>
    </div>
    <div class="panel">
      <h3>Engagement vs. Risk Score</h3>
      <div class="panel-sub">400-customer sample, coloured by cohort \u2014 shows how clusters separate in feature space</div>
      <div class="chart-wrap tall"><canvas id="chart-scatter"></canvas></div>
    </div>
  </div>`;
}

function buildCohortCharts(){
  const co = DATA.cohorts;
  new Chart(document.getElementById('chart-cohort-churn'), {
    type:'bar',
    data:{ labels: co.map(c=>c.CohortName),
      datasets:[{ data: co.map(c=>c.ChurnRatePct), backgroundColor: co.map(c=>COHORT_COLOR[c.CohortName]), borderRadius:4 }]},
    options:{ indexAxis:'y', plugins:{legend:{display:false}},
      scales:{ x:{ grid:{color:'#1c2846'}, ticks:{callback:v=>v+'%'} }, y:{ grid:{display:false}, ticks:{font:{size:11}} } } }
  });

  const groups = {};
  DATA.scatter_sample.forEach(d=>{ (groups[d.CohortName] = groups[d.CohortName]||[]).push(d); });
  const datasets = Object.keys(groups).map(name=>({
    label:name,
    data: groups[name].map(d=>({x:d.EngagementScore,y:d.RiskScore})),
    backgroundColor: COHORT_COLOR[name] + 'CC',
    pointRadius:3.5,
  }));
  new Chart(document.getElementById('chart-scatter'), {
    type:'scatter',
    data:{ datasets },
    options:{ plugins:{legend:{position:'bottom', labels:{boxWidth:8, font:{size:10}}}},
      scales:{ x:{ title:{display:true,text:'Engagement Score', font:{size:10}}, grid:{color:'#1c2846'} },
               y:{ title:{display:true,text:'Risk Score', font:{size:10}}, grid:{color:'#1c2846'} } } }
  });
}

/* ===================== Page 3: Drivers ===================== */
function pageDrivers(){

  const bc = DATA.by_contract;
  new Chart(document.getElementById('chart-contract-drivers'), {
    type:'bar',
    data:{ labels: bc.map(d=>d.Contract), datasets:[{ data: bc.map(d=>d.ChurnRate*100), backgroundColor:'#ff6b5e', borderRadius:4 }]},

/* ===================== Page 4: Revenue at Risk ===================== */
function pageRevenue(){
  const rows = DATA.revenue_at_risk.map(r=>`

    const badge = p>=60 ? 'high' : p>=35 ? 'med' : 'low';
    return `<tr>
      <td>${w.customerID}</td>
      <td>${w.CohortName}</td>
      <td><span class="badge ${badge}">${p.toFixed(1)}%</span></td>
      <td>${w.tenure} mo</td>
      <td>$${w.MonthlyCharges.toFixed(2)}</td>
      <td>${w.Contract}</td>
    </tr>`;
  }).join('');

  return `
  <div class="page-head">
    <h2>Retention Playbook</h2>
    <p>Six interventions mapped directly to the cohorts and churn drivers surfaced on the previous pages, plus a live watchlist of currently active customers scored highest for near-term churn risk.</p>
  </div>
  <div class="playbook-grid">${cards}</div>
  <div class="panel" style="margin-top:18px;">
    <h3>High-Risk Watchlist \u2014 Active Customers</h3>
    <div class="panel-sub">Top-scored active accounts by predicted churn probability (Random Forest model), for retention team follow-up</div>
    <div class="table-scroll">
      <table>
        <thead><tr><th>Customer ID</th><th>Cohort</th><th>Churn Prob.</th><th>Tenure</th><th>Monthly $</th><th>Contract</th></tr></thead>
        <tbody>${wl}</tbody>
      </table>
    </div>
  </div>`;
}

/* ===================== Boot ===================== */
function boot(){
  renderTabs();
  const main = document.getElementById('main');
  main.innerHTML = `
    <div class="page active" id="page-overview">${pageOverview()}</div>
    <div class="page" id="page-cohorts">${pageCohorts()}</div>
    <div class="page" id="page-drivers">${pageDrivers()}</div>
    <div class="page" id="page-revenue">${pageRevenue()}</div>
    <div class="page" id="page-playbook">${pagePlaybook()}</div>
  `;
  document.querySelector('.tab[data-page="overview"]').classList.add('active');
  buildOverviewCharts();
  window.__charted_overview = true;
}
boot();

</script>
</body>
</html>
